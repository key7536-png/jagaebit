<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 완료 — 자개빛 천운</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --rose:#f4a8b8;--lav:#e8a4cc;--purple:#b89adc;--gold:#d4a574;
  --grad:linear-gradient(135deg,#f4a8b8,#e8a4cc,#b89adc,#d4a574);
  --btn:linear-gradient(135deg,#c9a0dc,#e8a4cc,#f4a8b8);
}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#fdf4f0;
  background-image:
    radial-gradient(ellipse at 10% 5%,rgba(244,168,184,.45),transparent 50%),
    radial-gradient(ellipse at 90% 10%,rgba(232,164,204,.4),transparent 50%),
    radial-gradient(ellipse at 50% 60%,rgba(184,154,220,.3),transparent 55%);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  -webkit-font-smoothing:antialiased;
}

@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

.card{
  background:rgba(255,255,255,.92);
  border-radius:24px;
  padding:40px 28px 36px;
  max-width:420px;
  width:100%;
  box-shadow:0 20px 60px -15px rgba(184,154,220,.4);
  border:1px solid rgba(244,168,184,.3);
  animation:fadeUp .7s ease forwards;
  text-align:center;
}

.check-wrap{
  width:80px;height:80px;
  border-radius:50%;
  background:var(--grad);
  background-size:200% 200%;
  animation:shimmer 4s ease infinite, pop .5s ease forwards;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;
  box-shadow:0 10px 30px -8px rgba(184,154,220,.6);
}
.check-wrap svg{width:38px;height:38px;stroke:#fff;stroke-width:3;fill:none;}

.logo{
  font-family:'Noto Serif KR',serif;
  font-size:12px;letter-spacing:.4em;
  color:#b8865a;margin-bottom:10px;font-weight:700;
}

h1{
  font-family:'Noto Serif KR',serif;
  font-size:22px;font-weight:700;
  background:var(--grad);background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 6s ease infinite;
  line-height:1.5;margin-bottom:8px;
}

.sub{
  font-size:14px;color:#6a4858;line-height:1.8;margin-bottom:28px;
}

.divider{
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(244,168,184,.5),transparent);
  margin-bottom:24px;
}

.info-box{
  background:linear-gradient(135deg,rgba(244,168,184,.12),rgba(184,154,220,.12));
  border-radius:16px;
  padding:18px 16px;
  margin-bottom:24px;
  border:1px solid rgba(244,168,184,.3);
}
.info-box p{
  font-size:13px;color:#5a3a4a;line-height:1.9;
}
.info-box strong{color:#b89adc;font-weight:700;}

.kakao-btn{
  display:block;width:100%;
  padding:16px;
  border-radius:14px;
  background:#FAE100;
  border:none;cursor:pointer;
  font-size:16px;font-weight:700;
  color:#3A1D1D;
  text-decoration:none;
  box-shadow:0 8px 24px -8px rgba(250,225,0,.5);
  transition:transform .15s,box-shadow .15s;
  margin-bottom:12px;
}
.kakao-btn:active{transform:scale(.98);}
.kakao-icon{display:inline-block;margin-right:6px;font-size:18px;vertical-align:middle;}

.home-btn{
  display:block;width:100%;
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.8);
  border:1px solid rgba(244,168,184,.5);
  cursor:pointer;
  font-size:14px;font-weight:600;
  color:#6a4858;
  text-decoration:none;
  transition:transform .15s;
}
.home-btn:active{transform:scale(.98);}

.note{
  font-size:11px;color:#a87888;margin-top:16px;line-height:1.7;
}

.stars{
  font-size:20px;letter-spacing:4px;margin-bottom:6px;
}
</style>
</head>
<body>

<div class="card">
  <div class="check-wrap">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>

  <p class="logo">JAGAEBIT · 자개빛 천운</p>
  <div class="stars">✦ ✦ ✦</div>
  <h1>결제가 완료됐습니다</h1>
  <p class="sub">
    소중한 선택 감사드립니다 💜<br>
    지금 바로 카카오톡으로 상담을 시작하세요
  </p>

  <div class="divider"></div>

  <div class="info-box">
    <p>
      📌 <strong>상담 안내</strong><br>
      결제 완료 후 카카오톡 채널로 문의해 주시면<br>
      순서대로 성심껏 상담을 진행해 드립니다.<br><br>
      🕐 <strong>운영시간</strong>: 오전 10시 ~ 오후 10시<br>
      📋 <strong>이름 · 결제하신 상품</strong>을 함께 보내주세요
    </p>
  </div>

  <a href="http://pf.kakao.com/_hxamxhX/chat" target="_blank" class="kakao-btn">
    <span class="kakao-icon">💬</span> 카카오톡으로 상담 시작하기
  </a>

  <a href="/" class="home-btn">
    🏠 자개빛 홈으로 돌아가기
  </a>

  <p class="note">
    ✦ 명리학상담사 1급 · 타로상담사 1급 · 타로마스터 1급<br>
    전문 상담사가 직접 답변드립니다
  </p>
</div>

</body>
</html>
