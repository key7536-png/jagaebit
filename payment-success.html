<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 완료 — 자개빛 천운</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --rose:#f4a8b8;--lav:#e8a4cc;--purple:#b89adc;--mint:#9dd4d4;--gold:#d4a574;
  --text:#5a3a4a;--text2:#6a4858;--text3:#4a2a3a;
  --grad:linear-gradient(135deg,#f4a8b8 0%,#e8a4cc 30%,#b89adc 60%,#9dd4d4 80%,#d4a574 100%);
  --btn:linear-gradient(135deg,#c9a0dc 0%,#e8a4cc 50%,#f4a8b8 100%);
}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sparkle{0%,100%{opacity:0;transform:scale(0.5)}50%{opacity:1;transform:scale(1.1)}}

body{
  font-family:'Noto Sans KR',sans-serif;color:var(--text);
  background:#fdf4f0;
  background-image:
    radial-gradient(ellipse at 10% 5%,rgba(244,168,184,.45),transparent 50%),
    radial-gradient(ellipse at 90% 10%,rgba(232,164,204,.4),transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(184,154,220,.3),transparent 55%),
    radial-gradient(ellipse at 15% 85%,rgba(157,212,212,.35),transparent 55%);
  background-attachment:fixed;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(253,244,240,.85));
  border:1px solid rgba(244,168,184,.5);border-radius:28px;
  padding:40px 28px;max-width:440px;width:100%;
  box-shadow:0 24px 60px -16px rgba(184,154,220,.45);
  animation:fadeIn .7s ease forwards;
  position:relative;overflow:hidden;text-align:center;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--grad);background-size:200% 200%;animation:shimmer 5s ease infinite;
}

.icon-wrap{
  width:90px;height:90px;border-radius:50%;margin:0 auto 24px;
  background:var(--grad);background-size:200% 200%;animation:shimmer 5s ease infinite;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
  box-shadow:0 0 0 8px rgba(244,168,184,.15),0 12px 30px -8px rgba(184,154,220,.4);
  animation:float 4s ease-in-out infinite;
}

.title{
  font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;margin-bottom:8px;
  background:var(--grad);background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 6s ease infinite;
}
.subtitle{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:28px;}

.order-box{
  background:rgba(255,255,255,.7);border:1px solid rgba(244,168,184,.4);
  border-radius:16px;padding:18px 20px;margin-bottom:24px;text-align:left;
}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;
  border-bottom:1px solid rgba(244,168,184,.2);font-size:13px;}
.order-row:last-child{border-bottom:none;}
.order-label{color:var(--text2);}
.order-value{font-weight:700;color:var(--text3);}
.order-value.price{color:#b8865a;font-family:'Noto Serif KR',serif;font-size:15px;}

.notice{
  background:rgba(184,154,220,.1);border:1px solid rgba(184,154,220,.25);
  border-radius:14px;padding:14px 16px;margin-bottom:24px;
  font-size:12px;color:var(--text2);line-height:1.8;text-align:left;
}
.notice strong{color:var(--purple);}

.kakao-btn{
  display:block;width:100%;padding:14px;border-radius:999px;
  background:var(--btn);border:none;color:#fff;
  font-weight:700;font-size:15px;font-family:'Noto Serif KR',serif;
  letter-spacing:.05em;cursor:pointer;text-decoration:none;
  box-shadow:0 10px 26px -8px rgba(184,154,220,.55);
  transition:transform .2s;margin-bottom:12px;
}
.kakao-btn:hover{transform:translateY(-2px);}

.back-btn{
  display:block;width:100%;padding:11px;border-radius:999px;
  background:rgba(255,255,255,.8);border:1px solid rgba(244,168,184,.5);
  color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;
  text-decoration:none;transition:background .2s;
}
.back-btn:hover{background:#fff;}

.sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.sp{position:absolute;font-size:16px;animation:sparkle 3s ease-in-out infinite;}

footer-mini{display:block;margin-top:20px;font-size:11px;color:#a87888;text-align:center;}
</style>
</head>
<body>

<div class="card">
  <div class="sparkles">
    <span class="sp" style="top:8%;left:10%;animation-delay:0s">✦</span>
    <span class="sp" style="top:12%;right:12%;animation-delay:.8s">✧</span>
    <span class="sp" style="bottom:15%;left:8%;animation-delay:1.5s">✦</span>
    <span class="sp" style="bottom:10%;right:10%;animation-delay:.4s">✧</span>
  </div>

  <div class="icon-wrap">🔮</div>

  <h1 class="title">결제가 완료되었습니다</h1>
  <p class="subtitle">
    소중한 인연이 시작되었어요.<br>
    아래 주문 정보를 확인해 주세요.
  </p>

  <div class="order-box" id="order-info">
    <div class="order-row">
      <span class="order-label">상품명</span>
      <span class="order-value" id="order-name">—</span>
    </div>
    <div class="order-row">
      <span class="order-label">결제금액</span>
      <span class="order-value price" id="order-amount">—</span>
    </div>
    <div class="order-row">
      <span class="order-label">주문번호</span>
      <span class="order-value" id="order-id" style="font-size:11px;word-break:break-all">—</span>
    </div>
  </div>

  <div class="notice">
    <strong>📌 다음 단계 안내</strong><br>
    카카오톡 채널로 연락 주시면<br>
    <strong>생년월일시</strong>와 <strong>질문 내용</strong>을 확인 후<br>
    바로 상담을 시작해 드립니다.<br><br>
    <strong>PDF 리포트</strong>는 영업일 기준 1~2일 내 발송됩니다.
  </div>

  <a href="https://pf.kakao.com/_sunjin7536" target="_blank" class="kakao-btn">
    💬 카카오톡으로 상담 시작하기
  </a>
  <a href="/" class="back-btn">← 자개빛 천운 홈으로</a>
</div>

<footer-mini>© 2026 자개빛 (JAGAEBIT) · 문의: 카카오 @sunjin7536</footer-mini>

<script>
// URL 파라미터에서 결제 정보 추출 (토스페이먼츠 콜백)
(function(){
  const params = new URLSearchParams(location.search);
  const orderId   = params.get('orderId') || '';
  const amount    = params.get('amount')  || '';

  // sessionStorage에서 주문 정보 복원
  let orderName = '상담 서비스';
  try{
    const pending = JSON.parse(sessionStorage.getItem('pending_order')||'{}');
    if(pending.name) orderName = pending.name;
    if(pending.amount && !amount) document.getElementById('order-amount').textContent =
      Number(pending.amount).toLocaleString('ko-KR') + '원';
    sessionStorage.removeItem('pending_order');
  }catch(e){}

  if(orderId) document.getElementById('order-id').textContent = orderId;
  if(amount)  document.getElementById('order-amount').textContent = Number(amount).toLocaleString('ko-KR') + '원';
  document.getElementById('order-name').textContent = orderName;
})();
</script>
</body>
</html>
