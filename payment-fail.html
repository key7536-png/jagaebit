<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 — 자개빛 천운</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --rose:#f4a8b8;--lav:#e8a4cc;--purple:#b89adc;--mint:#9dd4d4;--gold:#d4a574;
  --text:#5a3a4a;--text2:#6a4858;--text3:#4a2a3a;
  --grad:linear-gradient(135deg,#f4a8b8 0%,#e8a4cc 30%,#b89adc 60%,#9dd4d4 80%,#d4a574 100%);
  --btn:linear-gradient(135deg,#c9a0dc 0%,#e8a4cc 50%,#f4a8b8 100%);
}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

body{
  font-family:'Noto Sans KR',sans-serif;color:var(--text);
  background:#fdf4f0;
  background-image:
    radial-gradient(ellipse at 10% 5%,rgba(244,168,184,.45),transparent 50%),
    radial-gradient(ellipse at 90% 10%,rgba(232,164,204,.4),transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(184,154,220,.3),transparent 55%),
    radial-gradient(ellipse at 15% 85%,rgba(157,212,212,.35),transparent 55%);
  background-attachment:fixed;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(253,244,240,.85));
  border:1px solid rgba(244,168,184,.5);border-radius:28px;
  padding:40px 28px;max-width:440px;width:100%;
  box-shadow:0 24px 60px -16px rgba(184,154,220,.45);
  animation:fadeIn .7s ease forwards;
  position:relative;overflow:hidden;text-align:center;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--grad);background-size:200% 200%;animation:shimmer 5s ease infinite;
}

.icon-wrap{
  width:90px;height:90px;border-radius:50%;margin:0 auto 24px;
  background:rgba(255,255,255,.8);border:2px solid rgba(244,168,184,.4);
  display:flex;align-items:center;justify-content:center;
  font-size:42px;
  animation:sway 3s ease-in-out infinite;
}

.title{
  font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;margin-bottom:8px;
  color:var(--text3);
}
.subtitle{font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:8px;}

.error-box{
  background:rgba(244,168,184,.1);border:1px solid rgba(244,168,184,.35);
  border-radius:14px;padding:14px 16px;margin-bottom:24px;
  font-size:12px;color:var(--text2);line-height:1.8;
}
.error-code{font-size:11px;color:#a87888;margin-top:6px;}

.notice{
  background:rgba(184,154,220,.1);border:1px solid rgba(184,154,220,.25);
  border-radius:14px;padding:14px 16px;margin-bottom:24px;
  font-size:13px;color:var(--text2);line-height:1.9;text-align:left;
}
.notice strong{color:var(--purple);}

.retry-btn{
  display:block;width:100%;padding:14px;border-radius:999px;
  background:var(--btn);border:none;color:#fff;
  font-weight:700;font-size:15px;font-family:'Noto Serif KR',serif;
  letter-spacing:.05em;cursor:pointer;text-decoration:none;
  box-shadow:0 10px 26px -8px rgba(184,154,220,.55);
  transition:transform .2s;margin-bottom:12px;
}
.retry-btn:hover{transform:translateY(-2px);}

.kakao-btn{
  display:block;width:100%;padding:12px;border-radius:999px;
  background:rgba(255,255,255,.8);border:1px solid rgba(244,168,184,.5);
  color:var(--text2);font-size:13px;font-weight:700;cursor:pointer;
  text-decoration:none;transition:background .2s;margin-bottom:10px;
}
.kakao-btn:hover{background:#fff;}

.back-btn{
  display:block;width:100%;padding:11px;border-radius:999px;
  background:transparent;border:none;
  color:#a87888;font-size:12px;cursor:pointer;
  text-decoration:none;
}

footer-mini{display:block;margin-top:20px;font-size:11px;color:#a87888;text-align:center;}
</style>
</head>
<body>

<div class="card">

  <div class="icon-wrap">🌙</div>

  <h1 class="title">결제가 완료되지 않았어요</h1>
  <p class="subtitle" id="fail-msg">
    취소하셨거나 오류가 발생했어요.<br>
    괜찮아요, 언제든 다시 시도하실 수 있습니다.
  </p>

  <div class="error-box" id="error-box" style="display:none">
    <div id="error-message"></div>
    <div class="error-code" id="error-code"></div>
  </div>

  <div class="notice">
    <strong>💬 카카오톡으로 직접 문의하시면</strong><br>
    계좌이체로도 편하게 결제 가능해요.<br>
    <strong>국민은행 박선진</strong> 계좌로 입금 후<br>
    카카오톡으로 알려주시면 바로 시작합니다.
  </div>

  <a href="/" class="retry-btn">✦ 다시 결제하기</a>
  <a href="https://pf.kakao.com/_TTxmxhX/chat" target="_blank" class="kakao-btn">
    💬 카카오톡으로 문의하기
  </a>
  <a href="/" class="back-btn">← 자개빛 천운 홈으로</a>
</div>

<footer-mini>© 2026 자개빛 (JAGAEBIT) · 문의: 카카오 @sunjin7536</footer-mini>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const code    = params.get('code')    || '';
  const message = params.get('message') || '';
  const orderId = params.get('orderId') || '';

  // 사용자 취소 vs 실제 오류 구분
  if(code === 'PAY_PROCESS_CANCELED' || code === 'USER_CANCEL'){
    document.querySelector('.title').textContent = '결제를 취소하셨어요';
    document.querySelector('#fail-msg').textContent = '언제든 다시 시도하실 수 있어요.\n마음의 준비가 되면 찾아오세요 🌸';
  } else if(code && message){
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    document.getElementById('error-message').textContent = '오류 내용: ' + message;
    document.getElementById('error-code').textContent = '코드: ' + code + (orderId ? ' · 주문번호: ' + orderId : '');
  }

  // sessionStorage 정리
  try{ sessionStorage.removeItem('pending_order'); }catch(e){}
})();
</script>
</body>
</html>
