<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 실패 — 자개빛 천운</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:#fdf4f0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 30% 20%,rgba(244,168,184,.4),transparent 50%);}
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border:1px solid rgba(244,168,184,.4);
  border-radius:24px;padding:48px 32px;text-align:center;max-width:400px;width:90%;
  box-shadow:0 20px 60px -15px rgba(184,154,220,.4);}
.icon{font-size:52px;margin-bottom:16px;}
h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;color:#4a2a3a;margin-bottom:12px;}
p{font-size:14px;color:#6a4858;line-height:1.7;margin-bottom:24px;}
.retry{display:block;background:linear-gradient(135deg,#c9a0dc,#e8a4cc,#f4a8b8);
  color:#fff;font-weight:700;padding:13px 28px;border-radius:14px;text-decoration:none;font-size:14px;
  box-shadow:0 4px 14px rgba(201,160,220,.4);margin-bottom:12px;}
.home{display:inline-block;color:#b89adc;font-size:13px;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🌙</div>
  <h1>결제가 취소되었어요</h1>
  <p>결제가 완료되지 않았어요.<br>다시 시도하시거나 카카오톡으로 문의해 주세요.</p>
  <a href="/jagaebit/" class="retry">다시 시도하기</a>
  <a href="https://pf.kakao.com/_sunjin7536" class="home">카카오톡 문의</a>
</div>
</body>
</html>
